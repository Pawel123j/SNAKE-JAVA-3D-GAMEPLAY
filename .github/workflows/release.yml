name: Release

# Uruchamiane tagiem: git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# REL-01: uprawnienia zadeklarowane w jobie (zapis wydania + podpis pochodzenia).
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # gh release create
      id-token: write       # OIDC dla podpisu Sigstore
      attestations: write   # atestacja pochodzenia JAR
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Testy
        run: mvn -B verify

      - name: Sprawdź, czy JAR się uruchamia
        # Ta sama weryfikacja co w CI. Wydanie nie może zawierać pliku,
        # którego nikt nie uruchomił.
        run: |
          set +e
          timeout 30 xvfb-run -a java -jar target/snake-3d-deluxe-*-shaded.jar > run.log 2>&1
          code=$?
          set -e
          cat run.log
          [ "$code" -eq 124 ] || { echo "::error::Gra zakończyła się sama (kod $code)"; exit 1; }
          grep -qE "Exception|Error:" run.log && { echo "::error::Wyjątki w logu"; exit 1; }
          echo "OK"

      - name: Przygotuj pliki wydania
        run: |
          mkdir -p upload
          cp target/snake-3d-deluxe-*-shaded.jar upload/snake-3d-deluxe.jar
          cd upload
          sha256sum snake-3d-deluxe.jar > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Atestacja pochodzenia (Sigstore)
        # Weryfikacja: gh attestation verify snake-3d-deluxe.jar --repo <owner>/SNAKE-JAVA-3D-GAMEPLAY
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: upload/snake-3d-deluxe.jar

      - name: Opublikuj wydanie
        # `gh` jest preinstalowane na runnerach, więc wydanie powstaje bez
        # zewnętrznej akcji — o jedną zależność, której trzeba ufać, mniej.
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Snake 3D Deluxe ${GITHUB_REF_NAME}" \
            --generate-notes \
            upload/snake-3d-deluxe.jar upload/SHA256SUMS.txt
